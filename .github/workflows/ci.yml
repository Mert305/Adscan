name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip ruff mypy pytest

      - name: Lint (ruff)
        run: ruff check adscan tests

      - name: Type check (mypy, bilgi amaçlı)
        run: mypy adscan || true

      - name: Run tests
        run: python -m pytest -q

      - name: Package import / entry point çözümlenebiliyor mu
        run: python -c "from adscan.cli import main; print('entry point OK')"
