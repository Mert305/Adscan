# pre-commit kurulumu:  pipx install pre-commit && pre-commit install
# Elle çalıştırma:       pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Çekirdek veri/akış modüllerinde sıkı tip kontrolü (CI ile aynı kapı).
  - repo: local
    hooks:
      - id: mypy-core
        name: mypy (çekirdek modüller, strict)
        entry: mypy --config-file pyproject.toml --follow-imports=silent
        language: system
        pass_filenames: false
        files: ^adscan/(findings|registry|chain|comparison|mitre|export)\.py$
        args:
          - adscan/findings.py
          - adscan/registry.py
          - adscan/chain.py
          - adscan/comparison.py
          - adscan/mitre.py
          - adscan/export.py
